<style id="page-css">
/* ================= 랜딩페이지 — 아카이브 도록 ================= */
.lp{
  --ink:#141414; --deep:#141414; --body:#3A3733; --muted:#7C766D;
  --paper:#F2F2EF; --panel:#EAE9E4; --rule:#D6D3CB; --paperA:rgba(242,242,239,.94);
  --sans:"IBM Plex Sans KR",system-ui,sans-serif;
  --serif:"Noto Serif KR","IBM Plex Sans KR",Georgia,serif;
  --mono:"IBM Plex Mono","IBM Plex Sans KR",monospace;
  background:var(--paper); color:var(--body); font-family:var(--sans);
  line-height:1.82; -webkit-font-smoothing:antialiased; overflow-x:hidden;
  /* 한국어는 어절 단위로 끊어야 읽힌다 */
  word-break:keep-all; overflow-wrap:break-word;
}
/* 폭 기준을 화면이 아니라 페이지가 놓인 자리로 잡는다 */
.lp__c{container-type:inline-size;container-name:lp;width:100%}
.lp *,.lp *::before,.lp *::after{box-sizing:border-box}
.lp img{max-width:100%;display:block}
.lp h1,.lp h2,.lp h3,.lp p,.lp ul,.lp ol,.lp dl,.lp dd,.lp figure,.lp blockquote{margin:0;padding:0}
.lp h1,.lp h2,.lp h3,.lp p{text-wrap:pretty}
.lp ul,.lp ol{list-style:none}
.lp a{color:inherit;text-decoration:none}
.lp button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.lp :focus-visible{outline:1px solid var(--ink);outline-offset:4px}

/* 제목은 세리프로 변주를 준다 */
.lp .head h1,
.lp h2.t,
.lp .end h2,
.lp .pull{
  font-family:var(--serif);
  font-weight:600;
  letter-spacing:-.02em;
}

.lp .wrap{width:100%;max-width:1000px;margin:0 auto;padding:0 28px}
.lp .sec{padding:clamp(56px,7vw,88px) 0;border-top:1px solid var(--rule)}
.lp .gr{display:grid;grid-template-columns:116px minmax(0,1fr);gap:0 36px;align-items:start}
.lp .lab{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:block}
.lp .spec{font-family:var(--mono);font-size:12px;letter-spacing:.01em;color:var(--muted);line-height:1.7}
.lp h2.t{font-size:clamp(20px,2.6vw,27px);font-weight:500;line-height:1.48;letter-spacing:-.015em;color:var(--ink)}
.lp .txt{font-size:15.5px;line-height:1.85;max-width:36em;color:var(--body)}
.lp .en{font-size:13.5px;color:var(--muted);line-height:1.8;max-width:38em;margin-top:14px}
.lp .cap{margin-top:10px}

.lp .lk{display:inline-block;font-size:14px;color:var(--ink);border-bottom:1px solid var(--ink);padding-bottom:2px;transition:opacity .16s}
.lp .lk:hover{opacity:.55}
.lp .lk--q{color:var(--muted);border-bottom-color:var(--rule)}
.lp .lk--q:hover{color:var(--ink);border-bottom-color:var(--ink)}
/* 채워진 요소는 오직 이것 하나 */
.lp .go{display:inline-flex;align-items:center;gap:9px;background:var(--deep);color:var(--paper);font-size:13.5px;font-weight:500;padding:14px 24px;transition:opacity .16s}
.lp .go:hover{opacity:.82}
.lp .go--sm{padding:9px 16px;font-size:12.5px}
.lp .acts{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;margin-top:30px}

.lp .top{position:sticky;top:0;z-index:40;background:var(--paperA);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.lp .top__in{display:flex;align-items:center;justify-content:space-between;gap:16px;height:62px}
.lp .top__n{font-size:14.5px;font-weight:500;color:var(--ink);letter-spacing:-.01em;min-width:0}
.lp .top__n small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--muted);margin-top:-1px}
.lp .top__r{display:flex;align-items:center;gap:20px}
.lp .top__r nav{display:flex;gap:18px}
.lp .top__r nav a{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--muted)}
.lp .top__r nav a:hover{color:var(--ink)}

/* ================= 판 — 사진·영상 위에 글 =================
   사진이 깔린 구간은 어두운 막을 덮고 글자를 밝게 뒤집는다.
   글이 길어져 위로 올라가도 막이 화면 전체에 깔려 있으므로 가려지지 않는다. */
.lp .head{padding:64px 0 0;text-align:center}
.lp .plate{position:relative;isolation:isolate;overflow:hidden;padding:0;display:flex;align-items:flex-end;
  min-height:min(1150px,105svh);
  /* 이 구간 안에서만 색이 반전된다 */
  --ink:#FFFFFF;
  --body:rgba(255,255,255,.88);
  --muted:rgba(255,255,255,.62);
  --rule:rgba(255,255,255,.26);
  --panel:rgba(255,255,255,.10);
  --deep:#FFFFFF;
  --paper:#141414;
  color:var(--body);
  border-top-color:transparent;
  text-shadow:0 1px 3px rgba(0,0,0,.4);
}
.lp .plate__bg,.lp .plate__video{position:absolute;inset:0;background-position:center top;background-size:cover;z-index:-3}
.lp .plate__video{width:100%;height:100%;object-fit:cover;object-position:center top}
/* 막의 세기는 --sc 하나로 조절된다. 위는 옅게, 글이 놓이는 아래로 갈수록 짙게 */
.lp .plate__sc{position:absolute;inset:0;z-index:-2;pointer-events:none;
  background:linear-gradient(180deg,
    rgba(0,0,0,calc(var(--sc,.45) * .60)) 0%,
    rgba(0,0,0,calc(var(--sc,.45) * .50)) 26%,
    rgba(0,0,0,calc(var(--sc,.45) * .95)) 58%,
    rgba(0,0,0,calc(var(--sc,.45) * 1.35)) 82%,
    rgba(0,0,0,calc(var(--sc,.45) * 1.55)) 100%)}
/* 위아래 가장자리는 종이색으로 번지게 해서 앞뒤 구간과 이어 붙인다.
   번짐 폭은 px 값과 높이 비율 중 작은 쪽을 써서, 짧은 구간에서도 글을 덮지 않는다 */
.lp .plate__edge{position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:
    linear-gradient(180deg, var(--pg,#F2F2EF) 0, var(--pg0,rgba(242,242,239,0)) min(var(--ft,70px), 10%)),
    linear-gradient(0deg,  var(--pg,#F2F2EF) 0, var(--pg0,rgba(242,242,239,0)) min(var(--fb,52px), 8%))}
.lp .plate>.wrap{position:relative;padding-top:clamp(112px,14vh,180px);padding-bottom:clamp(88px,9vw,132px)}
.lp .plate .txt{max-width:34em}
/* 반전 구간의 버튼은 흰 바탕에 검은 글씨 */
.lp .plate .go{text-shadow:none}
.lp .head h1{font-size:clamp(28px,5.2vw,52px);font-weight:500;line-height:1.28;letter-spacing:-.03em;color:var(--ink);max-width:20ch;margin-inline:auto}
.lp .head__sp{margin-top:20px;padding-top:14px;border-top:1px solid var(--rule);max-width:38em;margin-inline:auto}
.lp .head .txt{margin-top:24px;max-width:34em;margin-inline:auto}
.lp .head .en{margin-inline:auto}
.lp .head .acts{justify-content:center}

/* 스크롤 유도 아이콘 — 귀엽게 */
.lp .scroll-hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:5;
  display:grid;place-items:center;width:34px;height:34px;border-radius:50%;
  border:1px solid var(--rule);background:var(--paperA);backdrop-filter:blur(4px);
  transition:opacity .16s,transform .16s}
.lp .scroll-hint:hover{opacity:.7}
.lp .scroll-hint svg{width:16px;height:16px;color:var(--ink);animation:hint-float 1.8s ease-in-out infinite}
/* 어두운 막 위에서는 아이콘도 반전 */
.lp .plate .scroll-hint{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4)}
.lp .plate .scroll-hint svg{color:#FFFFFF}
@keyframes hint-float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(4px)}
}

.lp .ph{width:100%;background:var(--panel);display:grid;place-items:center;color:var(--muted);font-family:var(--mono);font-size:10.5px;letter-spacing:.12em}

/* 망설임 */
.lp .num{margin-top:28px;max-width:40em}
.lp .num li{padding:24px 0;border-top:1px solid var(--rule)}
.lp .num li:last-child{border-bottom:1px solid var(--rule)}
.lp .num b{display:block;font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.1em;margin-bottom:9px}
.lp .num strong{display:block;font-size:16px;font-weight:500;color:var(--ink);margin-bottom:8px;letter-spacing:-.012em;line-height:1.5}
.lp .num p{font-size:15px;line-height:1.85}
/* 전환 문장 */
.lp .pullfig{margin-top:30px}
.lp .pullfig img{width:100%;aspect-ratio:16/9;object-fit:cover}
.lp .pull{margin-top:40px;max-width:26em;font-size:clamp(17px,1.72vw,21px);font-weight:400;line-height:1.6;letter-spacing:-.022em;color:var(--ink);text-wrap:balance}

/* 시술자 */
.lp .cre{margin-top:26px;max-width:40em}
.lp .cre li{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px solid var(--rule);font-size:14.5px;line-height:1.7}
.lp .cre li:last-child{border-bottom:1px solid var(--rule)}
.lp .cre i{font-style:normal;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);padding-top:3px}
.lp .figw{margin-top:40px}
.lp .figw img{width:100%;aspect-ratio:3/2;object-fit:cover}

/* 작업 기록 */
.lp .fil{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:26px;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.lp .fil button{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--muted);padding-bottom:3px;border-bottom:1px solid transparent}
.lp .fil button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.lp .item{padding:34px 0;border-bottom:1px solid var(--rule)}
.lp .item__grid{display:grid;grid-template-columns:116px minmax(0,1fr);gap:0 36px;align-items:start}
.lp .item__m b{display:block;font-family:var(--mono);font-size:11.5px;color:var(--ink);letter-spacing:.1em}
.lp .item__m .spec{margin-top:8px}
.lp .item__t{font-size:16.5px;font-weight:500;color:var(--ink);margin-bottom:14px;letter-spacing:-.012em;line-height:1.5}
/* 비포/애프터 — 클릭 전환 */
.lp .cmp{position:relative;aspect-ratio:3/2;overflow:hidden;background:var(--panel);cursor:pointer;touch-action:manipulation;user-select:none}
.lp .cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.lp .cmp .aft{clip-path:inset(0 0 0 100%);transition:clip-path .45s cubic-bezier(.4,0,.2,1)}
.lp .cmp.show-after .aft{clip-path:inset(0 0 0 0%)}
.lp .cmp .bar{display:none}
.lp .cmp .knob{display:none}
.lp .cmp .tag{position:absolute;bottom:0;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:#F2F2EF;background:rgba(20,20,20,.62);padding:4px 9px;pointer-events:none}
.lp .cmp .tag--b{left:0}.lp .cmp .tag--a{right:0}
.lp .cmp__ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-family:var(--mono);font-size:10.5px;letter-spacing:.12em}
/* 클릭 안내 힌트 */
.lp .cmp__hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:#fff;background:rgba(20,20,20,.5);padding:3px 10px;pointer-events:none;opacity:.8}
.lp .empty{padding:48px 0;font-family:var(--mono);font-size:12px;color:var(--muted);border-bottom:1px solid var(--rule)}

/* 받은 말 — 사진 있을 때만 2단 */
.lp .qts{margin-top:28px}
.lp .qt{padding:30px 0;border-top:1px solid var(--rule)}
.lp .qt:last-child{border-bottom:1px solid var(--rule)}
.lp .qt__in{display:block;max-width:40em}
.lp .qt--img .qt__in{display:grid;grid-template-columns:172px minmax(0,1fr);gap:0 28px;align-items:start;max-width:none}
.lp .qt__f img{width:100%;aspect-ratio:4/5;object-fit:cover}
.lp .qt p{font-size:16px;line-height:1.85;color:var(--ink);letter-spacing:-.008em}
.lp .qt p::before{content:"“"}.lp .qt p::after{content:"”"}
.lp .qt .spec{margin-top:12px}
.lp .qt__btn{margin-top:14px}
.lp .qt__btn .lk{font-size:13px}

/* 가격 — 사진 있을 때만 2단 */
.lp .pl__i{padding:30px 0;border-top:1px solid var(--rule)}
.lp .pl__i:last-of-type{border-bottom:1px solid var(--rule)}
.lp .pl__in{display:block}
.lp .pl__i--img .pl__in{display:grid;grid-template-columns:minmax(0,1fr) 224px;gap:0 32px;align-items:start}
.lp .pl__f2 img{width:100%;aspect-ratio:4/3;object-fit:cover}
.lp .pl__f2 .spec{margin-top:8px}
.lp .pl__h{display:flex;justify-content:space-between;align-items:baseline;gap:18px;flex-wrap:wrap}
.lp .pl__n{font-size:17.5px;font-weight:500;color:var(--ink);letter-spacing:-.01em}
.lp .pl__n em{font-style:normal;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--muted);margin-left:10px}
.lp .pl__p{font-size:19px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.lp .pl__p s{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400;margin-right:10px;text-decoration-thickness:1px}
.lp .pl__i .spec{margin-top:8px}
.lp .pl__f{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:2px 24px}
.lp .pl__f li{font-size:14px;padding:4px 0 4px 15px;position:relative;line-height:1.7}
.lp .pl__f li::before{content:"·";position:absolute;left:2px;color:var(--muted)}
.lp .pl__i .lk{margin-top:18px}
.lp .notes{margin-top:20px;display:flex;flex-direction:column;gap:5px}

/* 진행 순서 — 사진 있을 때만 3단 */
.lp .stp{margin-top:28px}
.lp .stp li{display:grid;grid-template-columns:46px minmax(0,40em);gap:0 18px;padding:22px 0;border-top:1px solid var(--rule);align-items:start}
.lp .stp li:last-child{border-bottom:1px solid var(--rule)}
.lp .stp li.has{grid-template-columns:46px minmax(0,1fr) 236px;gap:0 28px}
.lp .stp i{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.08em;padding-top:5px}
.lp .stp b{display:block;font-size:15.5px;font-weight:500;color:var(--ink);margin-bottom:6px;line-height:1.5}
.lp .stp p{font-size:14.5px;line-height:1.8}
.lp .stp__f img{width:100%;aspect-ratio:4/3;object-fit:cover}
.lp .stp__f .spec{margin-top:8px}

/* 질문 */
.lp .qa{margin-top:26px;max-width:42em}
.lp .qa__i{border-top:1px solid var(--rule)}
.lp .qa__i:last-child{border-bottom:1px solid var(--rule)}
.lp .qa__q{width:100%;display:flex;justify-content:space-between;gap:18px;text-align:left;padding:18px 0;font-size:15.5px;color:var(--ink);line-height:1.6}
.lp .qa__q em{font-style:normal;font-family:var(--mono);font-size:13px;color:var(--muted);flex-shrink:0}
.lp .qa__i.open .qa__q em{color:var(--ink)}
.lp .qa__a{max-height:0;overflow:hidden;transition:max-height .28s ease}
.lp .qa__a p{padding:0 0 20px;font-size:15px;line-height:1.85;max-width:38em}

/* 마무리 · 연락처 */
.lp .end{padding:clamp(60px,8vw,92px) 0;border-top:1px solid var(--rule)}
.lp .end h2{font-size:clamp(22px,3.3vw,34px);font-weight:500;line-height:1.38;letter-spacing:-.03em;color:var(--ink);max-width:18ch}
.lp .end .txt{margin-top:20px;max-width:30em}
.lp .end__grid{display:grid;grid-template-columns:1.06fr .94fr;gap:0 56px;align-items:start}
.lp .end__act{display:flex;flex-direction:column;align-items:stretch;gap:14px}
.lp .end__act .go{width:100%;justify-content:center;padding:16px 24px}
.lp .end__act .lk{align-self:flex-start}
.lp .info{margin-top:30px;border-top:1px solid var(--rule)}
.lp .info div{display:grid;grid-template-columns:76px minmax(0,1fr);gap:0 14px;padding:12px 0;border-bottom:1px solid var(--rule)}
.lp .info dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:4px}
.lp .info dd{font-size:14.5px;color:var(--ink);line-height:1.7}
.lp .foot{padding:24px 0 100px;border-top:1px solid var(--rule)}
.lp .foot__in{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

.lp .dock{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;

<script id="page-js" type="text/plain">
(function(){
  var root = document.querySelector('.lp'); if(!root) return;

  var fils = root.querySelectorAll('.fil button');
  fils.forEach(function(f){
    f.addEventListener('click', function(){
      fils.forEach(function(x){ x.setAttribute('aria-selected','false'); });
      f.setAttribute('aria-selected','true');
      var k = f.dataset.f;
      root.querySelectorAll('.item').forEach(function(it){
        it.hidden = !(k === 'all' || it.dataset.f === k);
      });
      var e = root.querySelector('.empty');
      if(e) e.hidden = root.querySelectorAll('.item:not([hidden])').length > 0;
    });
  });

  // 비포/애프터 클릭 전환
  root.querySelectorAll('.cmp').forEach(function(st){
    // AFTER 는 가려져 있어 브라우저가 미루기만 한다. BEFORE 가 뜨면 이어서 받아 둔다
    var bi = st.querySelector('img:not(.aft)'), ai = st.querySelector('img.aft');
    if(ai){
      var pre = function(){ ai.loading = 'eager'; };
      if(!bi || (bi.complete && bi.naturalWidth)) pre(); else bi.addEventListener('load', pre);
    }
    st.setAttribute('tabindex','0');
    st.setAttribute('role','button');
    st.setAttribute('aria-label','비포 애프터 전환');
    st.addEventListener('click', function(){
      st.classList.toggle('show-after');
    });
    st.addEventListener('keydown', function(e){
      if(e.key==='Enter' || e.key===' '){
        e.preventDefault();
        st.classList.toggle('show-after');
      }
    });
  });

  root.querySelectorAll('.qa__q').forEach(function(q){
    q.addEventListener('click', function(){
      var i=q.parentElement, a=i.querySelector('.qa__a'), o=i.classList.contains('open');
      i.classList.toggle('open', !o);
      q.setAttribute('aria-expanded', String(!o));
      q.querySelector('em').textContent = o ? '+' : '−';
      a.style.maxHeight = o ? '0px' : (a.scrollHeight + 'px');
    });
  });

  // 아래쪽 배경 사진·영상은 화면 가까이 왔을 때 받는다
  function wake(el){
    var d = el.dataset;
    if(d.bg){ el.style.backgroundImage = 'url("'+d.bg.replace(/"/g,'%22')+'")'; el.removeAttribute('data-bg'); }
    if(d.poster){ el.poster = d.poster; el.removeAttribute('data-poster'); }
    if(d.src){ el.src = d.src; el.removeAttribute('data-src');
      var pl = el.play && el.play(); if(pl && pl.catch) pl.catch(function(){}); }
  }
  var lz = root.querySelectorAll('[data-bg],[data-src]');
  if('IntersectionObserver' in window){
    var lio = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting){ wake(en.target); lio.unobserve(en.target); }
      });
    }, {rootMargin:'800px 0px'});
    lz.forEach(function(el){ lio.observe(el); });
  } else {
    lz.forEach(wake);
  }

  // 스크롤 리빌 — 은은하게
  var rv = root.querySelectorAll('.rv');
  if('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting){
          en.target.classList.add('is-in');
          io.unobserve(en.target);
        }
      });
    }, {threshold:.12, rootMargin:'0px 0px -6% 0px'});
    rv.forEach(function(el){ io.observe(el); });
  } else {
    rv.forEach(function(el){ el.classList.add('is-in'); });
  }
})();
</script>

function hex2rgb(h){ var m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(String(h||'').trim());
  return m ? [parseInt(m[1],16),parseInt(m[2],16),parseInt(m[3],16)] : [242,242,239]; }
function rgb2hex(a){ return '#'+a.map(function(v){
  var x=Math.max(0,Math.min(255,Math.round(v))).toString(16); return x.length<2?'0'+x:x; }).join(''); }
function mix(a,b,t){ var x=hex2rgb(a), y=hex2rgb(b);
  return rgb2hex([0,1,2].map(function(i){ return x[i]+(y[i]-x[i])*t; })); }
function toneVars(c){
  var t = derive(c && c.tone);
  return '--ink:'+t.ink+';--deep:'+t.deep+';--body:'+t.body+';--muted:'+t.muted+
    ';--paper:'+t.paper+';--panel:'+t.panel+';--rule:'+t.rule+';--paperA:'+t.paperA+
    ';background:'+t.paper+';color:'+t.body+';';
}
function derive(tone){
  var paper = (tone && tone.paper) || '#F2F2EF';
  var ink   = (tone && tone.ink)   || '#141414';
  var c = hex2rgb(paper);
  return {
    paper:rgb2hex(c), ink:rgb2hex(hex2rgb(ink)), deep:rgb2hex(hex2rgb(ink)),
    body:  mix(ink, paper, 0.18),
    muted: mix(ink, paper, 0.46),
    rule:  mix(paper, ink, 0.16),
    panel: mix(paper, ink, 0.07),
    paperA:'rgba('+c[0]+','+c[1]+','+c[2]+',.94)'
  };
}

function pad(i){ return (i<9?'0':'')+(i+1); }
function cssurl(u){ return "url('"+String(u||'').replace(/['"\\\n\r()]/g,'')+"')"; }
function rgba(hex,a){ var c=hex2rgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function num(v,d){ var n=parseFloat(v); if(isNaN(n)) n=d; return Math.max(0,Math.min(1,n)); }
/* 판 한 장의 설정. --sc 는 어두운 막의 세기, --ft/--fb 는 위아래 종이색 번짐 폭 */
function plateVars(o,paper){
  var sc=num(o.scrim,0.45), fd=num(o.fade,0.5);
  return '--sc:'+sc+';--pg:'+paper+';--pg0:'+rgba(paper,0)+
    ';--ft:'+Math.round(30+fd*80)+'px;--fb:'+Math.round(24+fd*56)+'px;';
}
/* 사진·영상 중 있는 것 하나를 배경 층으로 만든다. lazy 면 화면 가까이 와서야 받는다 */
function plateLayer(o,lazy){
  if(o.video){
    var pre = lazy ? 'data-' : '';
    return '<video class="plate__video" autoplay muted loop playsinline'+(lazy?' preload="none"':'')+
      (o.videoPoster?' '+pre+'poster="'+esc(o.videoPoster)+'"':'')+' '+pre+'src="'+esc(o.video)+'"></video>';
  }
  if(o.bg){
    return lazy ? '<div class="plate__bg" data-bg="'+esc(o.bg)+'"></div>'
                : '<div class="plate__bg" style="background-image:'+cssurl(o.bg)+'"></div>';
  }
  return '';
}

var R = {};

R.pain = function(s){
  return '<ol class="num">'+ s.items.map(function(x,i){
      return '<li class="rv"><b>'+pad(i)+'</b><strong>'+esc(x.t)+'</strong><p>'+nl(x.d)+'</p></li>'; }).join('') +'</ol>'+
    (s.pull ? '<p class="pull rv">'+nl(s.pull)+'</p>' : '')+
    (s.pullImg ? '<figure class="pullfig rv"><img src="'+esc(s.pullImg)+'" alt="" loading="lazy">'+
      (s.pullCap?'<figcaption class="spec cap">'+esc(s.pullCap)+'</figcaption>':'')+'</figure>' : '');
};

R.artist = function(s,c){
  return '<div class="spec rv" style="margin-top:8px">'+esc(s.spec)+'</div>'+
    '<p class="txt rv" style="margin-top:20px">'+nl(s.txt)+'</p>'+
    (s.en?'<p class="en rv">'+nl(s.en)+'</p>':'')+
    '<ul class="cre">'+ s.creds.map(function(x){
      return '<li class="rv"><i>'+esc(x.k)+'</i><span>'+esc(x.v)+'</span></li>'; }).join('') +'</ul>';
};

R.arch = function(s){
  var fil = s.tabs.map(function(tb,i){
      return '<button data-f="t'+i+'" aria-selected="'+(i===0)+'">'+esc(tb.name)+'</button>'; }).join('')+
    '<button data-f="all" aria-selected="false">전체</button>';
  var items = [];
  s.tabs.forEach(function(tb,i){
    tb.items.forEach(function(it,j){
      var stage = (it.b||it.a)
        ? (it.b?'<img src="'+esc(it.b)+'" alt="시술 전" loading="lazy" decoding="async">':'<div class="cmp__ph">BEFORE 없음</div>')+
          (it.a?'<img class="aft" src="'+esc(it.a)+'" alt="시술 후" loading="lazy" decoding="async">':'')
        : '<div class="cmp__ph">BEFORE / AFTER</div>';
      var hint = (it.b&&it.a)?'<span class="cmp__hint">클릭하여 전환</span>':'';
      items.push('<article class="item rv" data-f="t'+i+'"'+(i===0?'':' hidden')+'><div class="item__grid">'+
        '<div class="item__m"><b>'+pad(j)+'</b><div class="spec">'+esc(tb.name)+'</div></div><div>'+
        '<div class="item__t">'+esc(it.t)+'</div>'+
        '<div class="cmp" tabindex="0" role="button" aria-label="시술 전후 전환">'+
          stage+hint+
          '<span class="tag tag--b">BEFORE</span><span class="tag tag--a">AFTER</span></div>'+
        (it.spec?'<div class="spec cap">'+esc(it.spec)+'</div>':'')+
      '</div></div></article>');
    });
  });
  return '<div class="fil">'+fil+'</div><div class="arch">'+items.join('')+
    '<div class="empty" hidden>기록이 없습니다.</div></div>'+
    (s.note?'<p class="spec rv" style="margin-top:20px">'+esc(s.note)+'</p>':'');
};

R.rev = function(s){
  return '<div class="qts">'+ s.items.map(function(x){
    var body = '<div><p>'+nl(x.t)+'</p>'+(x.spec?'<div class="spec">'+esc(x.spec)+'</div>':'')+
      (x.linkOn && x.linkUrl ? '<div class="qt__btn"><a class="lk" href="'+url(x.linkUrl)+'" target="_blank" rel="noopener">'+esc(x.linkText||'보러가기')+' ↗</a></div>' : '')+
      '</div>';
    return '<blockquote class="qt rv'+(x.img?' qt--img':'')+'"><div class="qt__in">'+
      (x.img?'<figure class="qt__f"><img src="'+esc(x.img)+'" alt="" loading="lazy"></figure>':'')+
      body+'</div></blockquote>'; }).join('') +'</div>';
};

R.price = function(s,c){
  var book = url(c.contact.kakao);
  return '<div class="pl">'+ s.plans.map(function(p){
    var left = '<div><div class="pl__h"><div class="pl__n">'+esc(p.n)+(p.best?'<em>가장 많이 선택</em>':'')+'</div>'+
      '<div class="pl__p">'+(p.was?'<s>'+esc(p.was)+'</s>':'')+esc(p.p)+'</div></div>'+
      (p.spec?'<div class="spec">'+esc(p.spec)+'</div>':'')+
      '<ul class="pl__f">'+ p.f.map(function(f){ return '<li>'+esc(f)+'</li>'; }).join('') +'</ul>'+
      '<a class="lk" href="'+book+'" target="_blank" rel="noopener">이 구성으로 상담받기</a></div>';
    var right = p.img ? '<figure class="pl__f2"><img src="'+esc(p.img)+'" alt="" loading="lazy">'+
      (p.cap?'<figcaption class="spec">'+esc(p.cap)+'</figcaption>':'')+'</figure>' : '';
    return '<div class="pl__i rv'+(p.img?' pl__i--img':'')+'"><div class="pl__in">'+left+right+'</div></div>'; }).join('') +'</div>'+
    (s.notes.length?'<div class="notes rv">'+ s.notes.map(function(n){ return '<span class="spec">'+esc(n)+'</span>'; }).join('') +'</div>':'');
};

R.steps = function(s){
  return '<ol class="stp">'+ s.items.map(function(x,i){
    var f = x.img ? '<figure class="stp__f"><img src="'+esc(x.img)+'" alt="" loading="lazy">'+
      (x.cap?'<figcaption class="spec">'+esc(x.cap)+'</figcaption>':'')+'</figure>' : '';
    return '<li class="rv'+(x.img?' has':'')+'"><i>'+pad(i)+'</i>'+
      '<div><b>'+esc(x.t)+'</b><p>'+nl(x.d)+'</p></div>'+f+'</li>'; }).join('') +'</ol>';
};

R.faq = function(s){
  return '<div class="qa">'+ s.items.map(function(x){
    return '<div class="qa__i rv"><button class="qa__q" aria-expanded="false">'+esc(x.q)+'<em>+</em></button>'+
      '<div class="qa__a"><p>'+nl(x.a)+'</p></div></div>'; }).join('') +'</div>';
};

function renderPage(c){
  var t = derive(c.tone);
  var v = toneVars(c);
  var kakao = url(c.contact.kakao);
  var live = c.sections.filter(function(s){ return s.on !== false; });
  var h=[];
  h.push('<div style="'+v+'"><div class="lp__c">');

  var nav = live.filter(function(s){ return ['arch','price','faq'].indexOf(s.type)>=0; })
    .map(function(s){ return '<a href="#s-'+s.type+'">'+esc(s.label)+'</a>'; }).join('');

  h.push('<header class="top"><div class="wrap top__in">'+
    '<div class="top__n">'+esc(c.brand.name)+(c.brand.latin?'<small>'+esc(c.brand.latin)+'</small>':'')+'</div>'+
    '<div class="top__r">'+(nav?'<nav>'+nav+'</nav>':'')+
      '<a class="go go--sm" href="'+kakao+'" target="_blank" rel="noopener">사진 상담</a></div>'+
  '</div></header>');

  var headBody = '<h1>'+nl(c.head.title)+'</h1>'+
    (c.head.spec?'<div class="head__sp spec">'+esc(c.head.spec)+'</div>':'')+
    '<p class="txt">'+nl(c.head.txt)+'</p>'+
    (c.head.en?'<p class="en">'+nl(c.head.en)+'</p>':'');

  var headMedia = plateLayer(c.head);

  var firstSec = live.length ? live[0].type : 'pain';
  var scrollHint = '<a href="#s-'+firstSec+'" class="scroll-hint" aria-label="아래로 스크롤">'+
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+
    '<path d="M5 9l7 7 7-7"/></svg></a>';

  h.push(headMedia
    ? '<section class="head plate" style="'+plateVars(c.head,t.paper)+'">'+
        headMedia+
        '<div class="plate__sc"></div><div class="plate__edge"></div>'+
        '<div class="wrap">'+headBody+'</div>'+
        scrollHint+
        '</section>'
    : '<section class="head"><div class="wrap">'+headBody+'</div>'+scrollHint+'</section>');

  live.forEach(function(s){
    var body = R[s.type] ? R[s.type](s,c) : '';
    var title = s.title || s.name || '';
    var lead = (s.txt && s.type!=='artist') ? '<p class="txt rv" style="margin-top:16px">'+nl(s.txt)+'</p>' : '';
    var inner = '<div class="gr__l"><span class="lab rv">'+esc(s.label)+'</span></div><div>'+
      (title?'<h2 class="t rv">'+nl(title)+'</h2>':'')+lead+body+'</div>';

    var media = plateLayer(s,true);

    if(media){
      h.push('<section class="sec plate" id="s-'+s.type+'" style="'+plateVars(s,t.paper)+'">'+
        media+'<div class="plate__sc"></div><div class="plate__edge"></div>'+
        '<div class="wrap gr">'+inner+'</div></section>');
    } else {
      h.push('<section class="sec" id="s-'+s.type+'"><div class="wrap gr">'+inner+'</div></section>');
    }
  });

  var tel = esc(String(c.contact.phone||'').replace(/[^0-9+]/g,''));
  h.push('<section class="end"><div class="wrap end__grid">'+
    '<div><h2 class="rv">'+nl(c.end.title)+'</h2><p class="txt rv">'+nl(c.end.txt)+'</p></div>'+
    '<div><div class="end__act rv">'+
      '<a class="go" href="'+kakao+'" target="_blank" rel="noopener">'+esc(c.end.cta||'무료로 상담받기')+'</a>'+
      ((c.end.telOn!==false && c.contact.phone)?'<a class="lk lk--q" href="tel:'+tel+'">전화 문의 '+esc(c.contact.phone)+'</a>':'')+
    '</div><dl class="info rv">'+
      (c.contact.hours?'<div><dt>영업</dt><dd>'+nl(c.contact.hours)+'</dd></div>':'')+
      (c.contact.addr?'<div><dt>주소</dt><dd>'+nl(c.contact.addr)+'</dd></div>':'')+
      (c.contact.place?'<div><dt>지도</dt><dd><a href="'+url(c.contact.place)+'" target="_blank" rel="noopener">오시는 길 ↗</a></dd></div>':'')+
      (c.contact.insta?'<div><dt>인스타</dt><dd><a href="'+url(c.contact.insta)+'" target="_blank" rel="noopener">바로가기 ↗</a></dd></div>':'')+
    '</dl></div>'+
  '</div></section>');

  h.push('<footer class="foot"><div class="wrap foot__in">'+
    '<span class="spec rv">© '+new Date().getFullYear()+' '+esc(c.brand.name)+'</span></div></footer>');

  h.push('</div>');

  if(c.end.dockOn !== false){
    var ig = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">'+
      '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/></svg>';
    var kk = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'+
      '<path d="M12 3.2c-5 0-9 3.1-9 7 0 2.5 1.7 4.7 4.2 5.9l-.9 3.4c-.1.3.2.6.5.4l4-2.6c.4 0 .8.1 1.2.1 5 0 9-3.1 9-7s-4-7.2-9-7.2z"/></svg>';
    var mp = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">'+
      '<path d="M12 21.2s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10.1" r="2.6"/></svg>';
    var d = [];
    if(c.end.dockKakao !== false && c.contact.kakao)
      d.push('<a class="go" href="'+kakao+'" target="_blank" rel="noopener">'+kk+'<span>'+esc(c.end.cta||'무료로 상담받기')+'</span></a>');
    if(c.end.dockPlace !== false && c.contact.place)
      d.push('<a class="dock__i" href="'+url(c.contact.place)+'" target="_blank" rel="noopener">'+mp+'<span>오시는 길</span></a>');
    if(c.end.dockInsta !== false && c.contact.insta)
      d.push('<a class="dock__i" href="'+url(c.contact.insta)+'" target="_blank" rel="noopener">'+ig+'<span>인스타그램</span></a>');
    if(d.length) h.push('<div class="dock">'+d.join('')+'</div>');
  }

  h.push('</div>'); return h.join('');
}
</script>

<script>
/* ---------- 에디터 ---------- */
var KIND = {
  str:function(){return '';},
  pain:function(){return {t:'',d:''};},
  cred:function(){return {k:'',v:''};},
  tab:function(){return {name:'새 시술', items:[]};},
  item:function(){return {t:'',spec:'',b:'',a:''};},
  rev:function(){return {t:'',spec:'',img:'',linkOn:false,linkText:'보러가기',linkUrl:''};},
  plan:function(){return {n:'',spec:'',p:'',was:'',best:false,img:'',cap:'',f:['']};},
  step:function(){return {t:'',d:'',img:'',cap:''};},
  faq:function(){return {q:'',a:''};}
};
var TYPE = {pain:'PAS 구조', artist:'인물', arch:'전후 비교', rev:'후기', price:'가격', steps:'순서', faq:'Q&A'};

function T(p,l){ return '<label class="f"><span>'+l+'</span><input type="text" data-p="'+p+'" value="'+esc(get(p))+'"></label>'; }
function A(p,l,r){ return '<label class="f"><span>'+l+'</span><textarea rows="'+(r||3)+'" data-p="'+p+'">'+esc(get(p))+'</textarea></label>'; }
function IMG(p,l,ratio,note){ var v=get(p);
  return '<div class="pic"><div class="pic__box" style="'+(v?'background-image:'+cssurl(v)+';background-size:cover':'')+'">'+(v?'':'—')+'</div>'+
  '<div class="pic__act"><span>'+l+(ratio?'<em>'+ratio+'</em>':'')+(note?'<em>'+note+'</em>':'')+'</span>'+
  '<button class="b b--x" data-img="'+p+'">사진 올리기</button> '+
  (v?'<button class="b b--x" data-imgdel="'+p+'">지우기</button>':'')+'</div></div>'; }
function VIDEO(p,l,note){ var v=get(p);
  return '<div class="pic"><div class="pic__box" style="'+(v?'background:#000;color:#E4E2DD;display:grid;place-items:center;font-size:8px':'')+'">'+(v?'MP4':'—')+'</div>'+
  '<div class="pic__act"><span>'+l+(note?'<em>'+note+'</em>':'')+'</span>'+
  '<button class="b b--x" data-video="'+p+'">영상 올리기</button> '+
  (v?'<button class="b b--x" data-videodel="'+p+'">지우기</button>':'')+'</div></div>'; }
function RNG(p,l,def){ var v=parseFloat(get(p)); if(isNaN(v)) v=(def==null?0.45:def);
  return '<label class="f"><span>'+l+'</span><span class="rng">'+
    '<input type="range" min="0" max="1" step="0.05" data-p="'+p+'" value="'+v+'">'+
    '<output>'+Math.round(v*100)+'%</output></span></label>'; }
function ADD(p,k,l){ return '<button class="b b--full" data-add="'+p+'" data-kind="'+k+'">+ '+l+'</button>'; }
function DEL(p,i){ return '<button class="b b--x" data-del="'+p+'" data-i="'+i+'">삭제</button>'; }
function CARD(t,p,i,inner){ return '<div class="card"><div class="card__h"><b>'+t+'</b>'+DEL(p,i)+'</div>'+inner+'</div>'; }
function HINT(x){ return '<div class="hint">'+x+'</div>'; }
function FIX(id,t,inner,o){ return '<div class="eb'+(o?' open':'')+'" data-eb="'+id+'">'+
  '<div class="eb__h"><button class="eb__t" data-toggle="1">'+t+'</button><i class="eb__x">'+(o?'−':'+')+'</i></div>'+
  '<div class="eb__c">'+inner+'</div></div>'; }

var ED = {};
ED.pain = function(s,b){
  return A(b+'.title','제목',2)+A(b+'.txt','도입',2)+
    s.items.map(function(x,i){ return CARD(pad(i),b+'.items',i, T(b+'.items.'+i+'.t','고민 (고객 말 그대로)')+A(b+'.items.'+i+'.d','답',3)); }).join('')+
    ADD(b+'.items','pain','추가')+
    A(b+'.pull','전환 문장',2)+
    IMG(b+'.pullImg','전환 문장 아래 사진','16:9','가로 1600px 이상')+T(b+'.pullCap','사진 설명')+
    HINT('"색소 침착 우려"가 아니라 "너무 진해질까 봐". 고객이 실제로 쓰는 말이어야 자기 이야기로 읽힙니다.');
};
ED.artist = function(s,b){
  return T(b+'.name','이름 (제목 자리)')+T(b+'.spec','사양줄')+A(b+'.txt','본문',5)+A(b+'.en','영문 (선택)',2)+
    IMG(b+'.bg','시술자 배경 사진','4:5','세로 · 인물은 위쪽에')+
    VIDEO(b+'.video','시술자 배경 영상','올리면 휴대폰용으로 자동으로 줄입니다 · 앞 15초')+
    IMG(b+'.videoPoster','영상 포스터','','영상이 뜨기 전 보이는 사진 · 비우면 첫 장면')+
    RNG(b+'.scrim','어두운 막 세기',0.55)+
    RNG(b+'.fade','가장자리 번짐',0.5)+
    s.creds.map(function(x,i){ return CARD(pad(i),b+'.creds',i,'<div class="row2">'+T(b+'.creds.'+i+'.k','구분')+T(b+'.creds.'+i+'.v','내용')+'</div>'); }).join('')+
    ADD(b+'.creds','cred','경력 추가')+
    HINT('사진이나 영상을 넣으면 이 구간에 어두운 막이 깔리고 글자가 흰색으로 뒤집힙니다. 글이 길어져 위로 올라가도 가려지지 않습니다. 밝은 사진일수록 막 세기를 올리세요. 경력이 많으면 60% 이상이 안전합니다. 가장자리 번짐은 위아래 끝을 종이색으로 흐려 앞뒤 구간과 이어 붙입니다.');
};
ED.arch = function(s,b){
  return T(b+'.title','제목')+A(b+'.txt','설명',3)+T(b+'.note','주의 문구')+
    s.tabs.map(function(tb,i){ return '<div class="card"><div class="card__h"><b>시술 '+pad(i)+'</b>'+DEL(b+'.tabs',i)+'</div>'+
      T(b+'.tabs.'+i+'.name','시술 이름 (필터에 표시)')+
      tb.items.map(function(it,j){ return '<div class="card" style="background:#0E0E0D">'+
        '<div class="card__h"><b>기록 '+pad(j)+'</b>'+DEL(b+'.tabs.'+i+'.items',j)+'</div>'+
        T(b+'.tabs.'+i+'.items.'+j+'.t','한 줄 제목')+T(b+'.tabs.'+i+'.items.'+j+'.spec','사양줄')+
        IMG(b+'.tabs.'+i+'.items.'+j+'.b','시술 전','3:2','전·후 동일 비율')+
        IMG(b+'.tabs.'+i+'.items.'+j+'.a','시술 후','3:2','전·후 동일 비율')+'</div>'; }).join('')+
      ADD(b+'.tabs.'+i+'.items','item','기록 추가')+'</div>'; }).join('')+
    ADD(b+'.tabs','tab','시술 추가')+
    HINT('이제 드래그하지 않고 사진을 클릭하면 BEFORE ↔ AFTER가 전환됩니다.');
};
ED.rev = function(s,b){
  return T(b+'.title','제목')+A(b+'.txt','설명',2)+
    s.items.map(function(x,i){ return CARD(pad(i),b+'.items',i,
      A(b+'.items.'+i+'.t','문장',3)+T(b+'.items.'+i+'.spec','서명줄 (이름 · 시술 · 날짜)')+
      IMG(b+'.items.'+i+'.img','후기 사진','4:5','세로 · 없으면 글만 전체 폭')+
      '<label class="f" style="margin-top:8px"><span><input type="checkbox" data-flag="'+b+'.items.'+i+'.linkOn"'+(x.linkOn?' checked':'')+'> 보러가기 버튼 표시</span></label>'+
      '<div class="row2">'+T(b+'.items.'+i+'.linkText','버튼 문구')+T(b+'.items.'+i+'.linkUrl','연결 링크')+'</div>'

    ADD(b+'.items','rev','추가')+

function move(from,to){
  if(to<0||to>=cfg.sections.length) return;
  var m=cfg.sections.splice(from,1)[0]; cfg.sections.splice(to,0,m); refresh(true);
}
function wireDrag(){
  var list=document.getElementById('sec-list'); if(!list) return;
  var src=null;
  list.querySelectorAll('.eb[data-i]').forEach(function(eb){
    var grip=eb.querySelector('.eb__gp');
    if(grip){
      grip.addEventListener('mousedown', function(){ eb.setAttribute('draggable','true'); });
      grip.addEventListener('touchstart', function(){ eb.setAttribute('draggable','true'); }, {passive:true});
    }
    eb.addEventListener('dragstart', function(e){
      src=eb; eb.classList.add('drag');
      e.dataTransfer.effectAllowed='move';
      try{ e.dataTransfer.setData('text/plain', eb.dataset.i); }catch(x){}
    });
    eb.addEventListener('dragend', function(){
      eb.removeAttribute('draggable'); eb.classList.remove('drag');
      list.querySelectorAll('.over').forEach(function(x){ x.classList.remove('over'); });
    });
    eb.addEventListener('dragover', function(e){
      e.preventDefault();
      if(src && src!==eb){ list.querySelectorAll('.over').forEach(function(x){ x.classList.remove('over'); }); eb.classList.add('over'); }
    });
    eb.addEventListener('drop', function(e){
      e.preventDefault();
      if(!src || src===eb) return;
      move(+src.dataset.i, +eb.dataset.i); src=null;
    });
  });
  document.addEventListener('mouseup', function(){
    list.querySelectorAll('.eb[draggable]').forEach(function(e){ e.removeAttribute('draggable'); });
  });
}

var pendingImgPath = null;
var fImg = document.getElementById('file-img');
fImg.addEventListener('change', function(){
  var f = this.files && this.files[0];
  if(!f || !pendingImgPath) return;

  var targetPath = pendingImgPath;
  pendingImgPath = null;

  var fr = new FileReader();
  fr.onload = function(){
    var im = new Image();
    im.onload = function(){
      try {
        var M = 1600, w = im.width, h = im.height;
        if(Math.max(w,h) > M){
          var r = M / Math.max(w,h);
          w = Math.round(w * r);
          h = Math.round(h * r);
        }
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        var cx = cv.getContext('2d');
        cx.drawImage(im, 0, 0, w, h);
        var dataUrl = cv.toDataURL('image/jpeg', 0.85);
        set(targetPath, dataUrl);
        refresh(true);
        toast('사진을 적용했습니다');
      } catch(err) {
        toast('이미지 처리 중 오류가 발생했습니다');
      }
    };
    im.onerror = function(){
      toast('이미지를 읽을 수 없습니다');
    };
    im.src = fr.result;
  };
  fr.onerror = function(){
    toast('파일을 읽을 수 없습니다');
  };
  fr.readAsDataURL(f);
});

/* ---------- 휴대폰용으로 줄이기 ---------- */
/* 사진은 긴 변 기준(배경 1440, 나머지 1080) WebP, 영상은 짧은 변 720 · 1.5Mbps · 소리 없음 · 앞 15초 */
var PHOTO_BG = 1440, PHOTO_EDGE = 1080;
var VIDEO_EDGE = 720, VIDEO_RATE = 1500000, VIDEO_MAX_SEC = 15, VIDEO_IN_MAX = 500*1024*1024;
var MB_URL = 'https://cdn.jsdelivr.net/npm/mediabunny@1.59.1/dist/bundles/mediabunny.min.mjs';
var mbLib = null;
function loadMB(){ return mbLib || (mbLib = import(MB_URL).catch(function(e){ mbLib = null; throw e; })); }

function mbStr(n){ return n < 1048576 ? Math.max(1,Math.round(n/1024))+'KB' : (n/1048576).toFixed(n < 10485760 ? 1 : 0)+'MB'; }
function blobOf(dataUrl){ return fetch(dataUrl).then(function(r){ return r.blob(); }); }
function dataUrlOf(blob){ return new Promise(function(ok,no){
  var fr = new FileReader(); fr.onload = function(){ ok(fr.result); }; fr.onerror = no; fr.readAsDataURL(blob); }); }
function loadImg(src){ return new Promise(function(ok,no){
  var im = new Image(); im.onload = function(){ ok(im); }; im.onerror = no; im.src = src; }); }
function canvasBlob(cv,type,q){ return new Promise(function(ok){ cv.toBlob(ok,type,q); }); }

async function shrinkImage(src, edge){
  var im = await loadImg(src);
  var w = im.naturalWidth, h = im.naturalHeight, r = Math.min(1, edge/Math.max(w,h));
  w = Math.round(w*r); h = Math.round(h*r);
  var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  var cx = cv.getContext('2d'); cx.imageSmoothingQuality = 'high'; cx.drawImage(im,0,0,w,h);
  var b = await canvasBlob(cv,'image/webp',0.8);
  // 사파리는 WebP 로 저장하지 못하고 PNG 를 돌려준다
  if(!b || b.type !== 'image/webp') b = await canvasBlob(cv,'image/jpeg',0.82);
  return b;
}

async function shrinkVideo(blob, onProgress){
  if(!('VideoEncoder' in window)) throw new Error('no-webcodecs');
  var MB = await loadMB();
  var input = new MB.Input({source:new MB.BlobSource(blob), formats:MB.ALL_FORMATS});
  var vt = await input.getPrimaryVideoTrack();
  if(!vt) throw new Error('no-video');
  var w = vt.displayWidth, h = vt.displayHeight, r = Math.min(1, VIDEO_EDGE/Math.min(w,h));
  var dur = await input.computeDuration(), cut = dur > VIDEO_MAX_SEC + 0.5;
  var fps = 30;
  try{ var st = await vt.computePacketStats(60); if(st.averagePacketRate && st.averagePacketRate < 30) fps = 0; }catch(e){}
  var vopt = {width:Math.round(w*r/2)*2, height:Math.round(h*r/2)*2, fit:'cover', codec:'avc',
    quality:new MB.Quality({bitrate:VIDEO_RATE}), forceTranscode:true};
  if(fps) vopt.frameRate = fps;
  var output = new MB.Output({format:new MB.Mp4OutputFormat({fastStart:'in-memory'}), target:new MB.BufferTarget()});
  var opts = {input:input, output:output, tracks:'primary', showWarnings:false, video:vopt, audio:{discard:true}};
  if(cut) opts.trim = {start:0, end:VIDEO_MAX_SEC};
  var conv = await MB.Conversion.init(opts);
  if(!conv.isValid) throw new Error('cannot-convert');
  if(onProgress) conv.onProgress = onProgress;
  await conv.execute();
  return {blob:new Blob([output.target.buffer],{type:'video/mp4'}), cut:cut};
}

/* 영상 첫 장면을 포스터 사진으로 */
function posterOf(blob){ return new Promise(function(ok){
  var v = document.createElement('video'), u = URL.createObjectURL(blob), end = false;
  function fin(x){ if(end) return; end = true; URL.revokeObjectURL(u); ok(x); }
  v.muted = true; v.playsInline = true; v.preload = 'auto';
  v.onloadeddata = function(){ v.currentTime = Math.min(0.1, (v.duration||1)/2); };
  v.onseeked = function(){
    try{ var cv = document.createElement('canvas'); cv.width = v.videoWidth; cv.height = v.videoHeight;
      cv.getContext('2d').drawImage(v,0,0); fin(cv.toDataURL('image/jpeg',0.82)); }catch(e){ fin(''); } };
  v.onerror = function(){ fin(''); };
  setTimeout(function(){ fin(''); }, 8000);
  v.src = u;
}); }

  }

  busy('영상 줄이는 중','휴대폰에서 빨리 뜨도록 줄이고 있습니다. 창을 닫지 마세요.');
  var out = f, note = '';
  try{
    var r = await shrinkVideo(f, function(p){ busyMsg(null,p); });
    if(r.cut || r.blob.size < f.size) out = r.blob;
    if(r.cut) note = ' · 앞 15초만 사용';
  }catch(err){
    console.warn(err);
    if(f.size > 15*1024*1024){
      busyEnd();
      toast('이 브라우저에서는 영상을 줄일 수 없습니다. 크롬 최신 버전에서 다시 올려주세요');
      return;
    }
    note = ' · 원본 그대로';
  }
  try{
    set(targetPath, await dataUrlOf(out));
    if(!get(targetPath+'Poster')){ var ps = await posterOf(out); if(ps) set(targetPath+'Poster', ps); }
    busyEnd(); refresh(true);
    toast('영상을 적용했습니다 · '+mbStr(out.size)+note);
  }catch(err){
    busyEnd(); toast('파일을 읽을 수 없습니다');
  }
});

function buildDoc(c){
  var css=document.getElementById('page-css').textContent, js=document.getElementById('page-js').textContent;
  var desc=String(c.head.txt).replace(/\s+/g,' ').slice(0,150);
  var title=c.brand.name+(c.head.spec?' — '+c.head.spec:'');
  var ld={"@context":"https://schema.org","@type":"BeautySalon","name":c.brand.name,"description":desc,
    "telephone":c.contact.phone,
    "address":{"@type":"PostalAddress","streetAddress":c.contact.addr,"addressCountry":"KR"},
    "openingHours":c.contact.hours,"sameAs":[c.contact.insta].filter(Boolean)};
  return '<!doctype html>\n<html lang="ko">\n<head>\n<meta charset="utf-8">\n'+
  '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n'+
  '<title>'+esc(title)+'</title>\n<meta name="description" content="'+esc(desc)+'">\n'+
  '<meta property="og:title" content="'+esc(title)+'">\n<meta property="og:description" content="'+esc(desc)+'">\n'+
  '<meta property="og:type" content="website">\n<meta name="theme-color" content="'+derive(c.tone).paper+'">\n'+
  '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'+
  '<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet">\n'+
  '<script type="application/ld+json">'+JSON.stringify(ld)+'<\/script>\n'+
  '<style>html,body{margin:0;padding:0;background:'+derive(c.tone).paper+';-webkit-text-size-adjust:100%}\n'+css+'</style>\n</head>\n<body>\n'+
  '<div class="lp" style="'+toneVars(c)+'">'+renderPage(c)+'</div>\n<script>'+js+'<\/script>\n</body>\n</html>';
}
function dl(n,t,ty){ var b=(t instanceof Blob)?t:new Blob([t],{type:ty||'text/plain;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u; a.download=n; document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(u);a.remove();},4000); }

/* ---------- zip — 사진·영상은 이미 압축돼 있어서 묶기만 한다 ---------- */
var CRC = (function(){ var t=new Uint32Array(256);
  for(var n=0;n<256;n++){ var c=n; for(var k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(u){ var c=0xFFFFFFFF; for(var i=0;i<u.length;i++) c=CRC[(c^u[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function fnv(u){ var h=0x811c9dc5; for(var i=0;i<u.length;i++){ h^=u[i]; h=Math.imul(h,0x01000193); }
  return ('0000000'+(h>>>0).toString(16)).slice(-8); }
function zip(files){
  var enc=new TextEncoder(), parts=[], cen=[], off=0, cl=0, d=new Date();
  var tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  var dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  files.forEach(function(f){
    var nm=enc.encode(f.name), sz=f.data.length, crc=crc32(f.data);
    var lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true);
    lh.setUint16(10,tm,true); lh.setUint16(12,dt,true); lh.setUint32(14,crc,true);
    lh.setUint32(18,sz,true); lh.setUint32(22,sz,true); lh.setUint16(26,nm.length,true);
    parts.push(lh, nm, f.data);
    var ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true);
    ch.setUint16(12,tm,true); ch.setUint16(14,dt,true); ch.setUint32(16,crc,true);
    ch.setUint32(20,sz,true); ch.setUint32(24,sz,true); ch.setUint16(28,nm.length,true); ch.setUint32(42,off,true);
    cen.push(ch, nm);
    off += 30+nm.length+sz; cl += 46+nm.length;
  });
  var e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true);
  e.setUint32(12,cl,true); e.setUint32(16,off,true);
  return new Blob(parts.concat(cen,[e]),{type:'application/zip'});
}

/* ---------- 페이지 내려받기 — 휴대폰용으로 줄여 index.html + media 폴더를 zip 하나로 ---------- */
/* 파일 이름에 내용 지문이 붙어 있어서 _headers 로 1년 캐시를 걸어도 고친 사진은 새로 받는다 */
var HEADERS = '/media/*\n  Cache-Control: public, max-age=31536000, immutable\n';
var EXT = {'image/webp':'webp','image/jpeg':'jpg','image/png':'png','image/gif':'gif',
  'video/mp4':'mp4','video/quicktime':'mov','video/webm':'webm'};
var exporting = false;
async function exportPage(){
  if(exporting) return; exporting = true;
  busy('페이지 만드는 중','사진과 영상을 휴대폰에 맞게 줄이고 있습니다.');
  try{
    var enc = new TextEncoder();
    var c = JSON.parse(JSON.stringify(cfg));
    c.sections = c.sections.filter(function(s){ return s.on !== false; });
    var old = new Blob([buildDoc(c)]).size;

    var jobs = [];
    (function walk(o){ Object.keys(o).forEach(function(k){ var v=o[k];
      if(typeof v==='string'){ if(v.indexOf('data:')===0) jobs.push({o:o,k:k}); }
      else if(v && typeof v==='object') walk(v); }); })(c);

    var done = new Map(), files = [], size = {}, cnt = {photo:0, video:0};
    for(var i=0;i<jobs.length;i++){
      var j = jobs[i], v = j.o[j.k];
      if(!done.has(v)){
        busyMsg((i+1)+' / '+jobs.length+' 줄이는 중', i/jobs.length);
        var src = await blobOf(v), out = src, isV = /^data:video\//.test(v);
        if(isV){
          // 올릴 때 이미 줄였으면 그대로, 예전 설정 파일의 원본 영상이면 여기서 줄인다
          if(src.size > 4*1048576){
            try{ var r = await shrinkVideo(src, function(p){ busyMsg(null,(i+p)/jobs.length); });
              if(r.cut || r.blob.size < src.size) out = r.blob; }catch(err){ console.warn(err); }
          }
        } else {
          try{ var b = await shrinkImage(v, (j.k==='bg'||j.k==='videoPoster') ? PHOTO_BG : PHOTO_EDGE);
            if(b && (b.size < src.size || !EXT[src.type])) out = b; }catch(err){ console.warn(err); }
        }
        var u8 = new Uint8Array(await out.arrayBuffer());
        var kind = isV ? 'video' : 'photo'; cnt[kind]++;
        var name = 'media/'+kind+'-'+pad(cnt[kind]-1)+'-'+fnv(u8)+'.'+(EXT[out.type] || (isV?'mp4':'jpg'));
        files.push({name:name, data:u8}); size[name] = u8.length;
        done.set(v, name);
      }
      j.o[j.k] = done.get(v);
    }
    busyMsg('묶는 중', 1);

    var html = enc.encode(buildDoc(c));
    files.unshift({name:'index.html', data:html});
    files.push({name:'_headers', data:enc.encode(HEADERS)});
    var blob = zip(files);
    var fname = (String(c.brand.name||'').replace(/[\\\/:*?"<>|\s]+/g,'') || 'my')+'_페이지.zip';
    dl(fname, blob);

    // 첫 화면 = 글 + 표제의 영상·포스터 또는 배경 사진
    var h = c.head, first = html.length +
      (h.video ? (size[h.video]||0) + (size[h.videoPoster]||0) : (size[h.bg]||0));
    busyEnd();
    showResult({name:fname, total:blob.size, old:old, first:first, photo:cnt.photo, video:cnt.video,
      big:files.some(function(f){ return f.data.length > 25*1048576; })});
  }catch(err){
    console.error(err); busyEnd(); toast('내려받기 중 오류가 났습니다. 다시 눌러 주세요');
  }finally{ exporting = false; }
}
function showResult(r){
  document.getElementById('modal-in').innerHTML =
    '<h3>내려받기 완료</h3>'+
    '<p><code>'+esc(r.name)+'</code> 파일이 내려받기 폴더에 저장됐습니다. 압축을 풀지 말고 이 파일 그대로 올리면 됩니다.</p>'+
    '<table class="sz">'+
      '<tr><th>전체</th><td>'+mbStr(r.total)+(r.old > r.total*1.1 ? ' <span style="color:#8C877E">(줄이기 전 '+mbStr(r.old)+')</span>' : '')+'</td></tr>'+
      '<tr><th>첫 화면에서 받는 양</th><td>'+mbStr(r.first)+'</td></tr>'+
      '<tr><th>사진 · 영상</th><td>'+r.photo+'장 · '+r.video+'개</td></tr>'+
    '</table>'+
    (r.big ? '<p class="warn">25MB가 넘는 파일이 있어 클라우드플레어에 올라가지 않습니다. 영상을 더 짧게 잘라 다시 올려 주세요.</p>' : '')+
    '<p><button class="b b--go" id="go-deploy">배포하는 법 보기</button> '+
    '<button class="b" onclick="document.getElementById(\'modal\').classList.remove(\'on\')">닫기</button></p>';
  document.getElementById('go-deploy').onclick = function(){ document.getElementById('btn-deploy').click(); };
  modal.classList.add('on');
}
